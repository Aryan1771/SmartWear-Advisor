<!DOCTYPE html>
<html>
<head>
  <title>SmartWear Advisor</title>
  <style>
    body {
      background: #0d1117;
      color: #f0f6fc;
      font-family: Segoe UI;
      text-align: center;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .camera-box {
      position: relative;
    }
    video {
      width: 500px;
      border-radius: 10px;
      transform: scaleX(-1); /* mirror */
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .panel {
      background: #1f2937;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      min-width: 250px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      background: #238636;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h1>SmartWear Advisor</h1>
<div>
  <button onclick="startCamera()">Start Camera</button>
  <button onclick="capture()">Analyze</button>
</div>
<div class="container">
  <div class="camera-box">
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>
  </div>
  <div class="panel">
    <h3>User: <span id="name">--</span></h3>
    <p>Mask: <span id="mask">--</span></p>
    <p>Glasses: <span id="glasses">--</span></p>
    <p>Temp: <span id="temp">--</span></p>
  </div>
</div>
<script>
const BACKEND = "https://smartwear-backend-3moi.onrender.com";
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  };
}
async function capture() {
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = video.videoWidth;
  tempCanvas.height = video.videoHeight;
  const tctx = tempCanvas.getContext("2d");
  tctx.drawImage(video, 0, 0);
  const blob = await new Promise(r => tempCanvas.toBlob(r, "image/jpeg"));
  let formData = new FormData();
  formData.append("file", blob);
  let res = await fetch(`${BACKEND}/analyze`, {
    method: "POST",
    body: formData
  });
  let data = await res.json();
  updateUI(data);
  drawBox(data);
}
function drawBox(data) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!data || !data.accessories) return;
  if (!data.status || data.status !== "success") return;
}
function updateUI(data) {
  document.getElementById("name").innerText = data.name || "--";
  document.getElementById("mask").innerText = data.accessories?.mask || "--";
  document.getElementById("glasses").innerText = data.accessories?.glasses || "--";
  document.getElementById("temp").innerText = data.weather?.temp || "--";
}
</script>
</body>
</html>
