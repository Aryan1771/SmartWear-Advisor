<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | SmartWear Advisor</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="login-body">

<div class="login-container">

  <!-- ================= HEADER ================= -->
  <div class="login-header">
    <div class="icon">🔐</div>
    <h1>Admin Login</h1>
    <p>SmartWear Advisor — restricted area</p>
  </div>

  <!-- ================= FLASH MESSAGES ================= -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash-msg flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- ================= LOGIN CARD ================= -->
  <div class="card login-card">

    <form method="POST" action="/admin/login" id="login-form">

      <label class="label">Admin Password</label>

      <div class="password-wrapper">
        <input
          type="password"
          name="password"
          id="password"
          class="input-field"
          placeholder="Enter admin password"
          autocomplete="current-password"
          required
          autofocus
        >

        <button type="button" class="toggle-eye" onclick="togglePassword()">
          👁️
        </button>
      </div>

      <button type="submit" class="btn btn-success" id="login-btn">
        Sign In
      </button>

    </form>

  </div>

  <!-- ================= FOOTER ================= -->
  <div class="login-footer">
    <a href="/">← Back to SmartWear</a>

    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
      🌙
    </button>
  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
  // Use shared theme system (same as ui.js)
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
  }

  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark'
      ? 'light'
      : 'dark';

    localStorage.setItem('sw-theme', next);
    applyTheme(next);
  }

  applyTheme(localStorage.getItem('sw-theme') || 'dark');

  // Password toggle
  function togglePassword() {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  // Prevent double submit
  const form = document.getElementById("login-form");
  const btn = document.getElementById("login-btn");

  form?.addEventListener("submit", () => {
    btn.disabled = true;
    btn.textContent = "Signing in...";
  });
</script>

</body>
</html>
