<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartWear Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <main class="auth-card panel">
    <p class="eyebrow">Admin access</p>
    <h1>Sign in to SmartWear Admin</h1>
    <p class="hero-text">Review registrations, detection history, and audit activity without exposing destructive controls.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="POST" action="/admin/login">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" class="text-input" placeholder="Enter password" required>
      <div class="action-row">
        <button type="submit" class="btn btn-accent">Login</button>
        <a href="/" class="btn btn-secondary">Back to scanner</a>
      </div>
    </form>
  </main>

  <script type="module">
    import { initAppShell } from "{{ url_for('static', filename='js/ui.js') }}";
    initAppShell();
  </script>
</body>
</html>
