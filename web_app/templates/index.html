<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWear Advisor | Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#f0f6fc] p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl md:text-3xl font-bold mb-4">SmartWear Advisor <span class="text-sm font-normal text-blue-500 underline">Remote</span></h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-[#161b22] border border-[#30363d] rounded-lg overflow-hidden relative">
                <div class="relative aspect-video bg-black flex items-center justify-center">
                    <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    <div id="offline-ui" class="absolute inset-0 bg-black/70 flex items-center justify-center">
                        <p class="text-gray-400">Camera Paused</p>
                    </div>
                </div>
                <div class="p-4 flex justify-between text-xs md:text-sm bg-[#0d1117]">
                    <span id="status-text" class="flex items-center gap-2">
                        <span id="pulse" class="w-2 h-2 rounded-full bg-gray-500"></span> Ready
                    </span>
                    <span id="location-msg" class="text-blue-400 font-mono">GPS Locating...</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-[#161b22] border border-[#30363d] p-4 rounded-lg shadow-sm">
                    <h2 class="font-bold mb-4">Controls</h2>
                    <input type="text" id="city" value="Ghaziabad" class="w-full bg-[#0d1117] border border-[#30363d] p-2 rounded mb-4 outline-none focus:border-blue-500">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="startApp()" class="bg-[#238636] hover:bg-[#2ea043] py-2 rounded font-bold transition">Start</button>
                        <button onclick="stopApp()" class="bg-[#da3633] hover:bg-[#f85149] py-2 rounded font-bold transition">Stop</button>
                    </div>
                    <button onclick="registerFace()" class="w-full border border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-white py-2 rounded font-bold mt-2 transition">Register Profile</button>
                </div>
                <div class="bg-[#1f2937] p-4 rounded-lg border border-[#30363d]">
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Identity Found</p>
                    <p id="name-display" class="text-xl mt-1 text-blue-200">Scanning...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        let userCoords = { lat: null, lon: null };
        let active = false;

        // Get Location
        navigator.geolocation.getCurrentPosition(p => {
            userCoords = { lat: p.coords.latitude, lon: p.coords.longitude };
            document.getElementById('location-msg').innerText = "GPS Fixed";
        }, () => { document.getElementById('location-msg').innerText = "GPS Error"; });

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 } } 
                });
                video.srcObject = stream;
                document.getElementById('offline-ui').classList.add('hidden');
                document.getElementById('pulse').classList.replace('bg-gray-500', 'bg-green-500');
                document.getElementById('pulse').classList.add('animate-pulse');
                active = true;
                processLoop();
            } catch (err) { alert("Camera Error: Allow browser access."); }
        }

        function stopApp() {
            active = false;
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('offline-ui').classList.remove('hidden');
            document.getElementById('pulse').classList.remove('animate-pulse');
            document.getElementById('pulse').classList.replace('bg-green-500', 'bg-gray-500');
        }

        async function processLoop() {
            if (!active) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const frame = canvas.toDataURL('image/jpeg', 0.5);

            try {
                const res = await fetch('/process_remote_frame', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image: frame })
                });
                const data = await res.json();
                
                if (data.name && data.name !== "Unknown") {
                    document.getElementById('name-display').innerText = data.name;
                    const city = document.getElementById('city').value;
                    // PASS DATA TO URL SO DETAIL PAGE ISN'T N/A
                    window.location.href = `/detail/${data.name}?lat=${userCoords.lat}&lon=${userCoords.lon}&city=${city}&mask=${data.mask}&glasses=${data.glasses}`;
                    return; 
                }
            } catch (e) { console.error("Server Link Broken"); }
            setTimeout(processLoop, 1000);
        }

        async function registerFace() {
            const name = prompt("Enter Name:");
            if(!name) return;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const frame = canvas.toDataURL('image/jpeg', 0.8);
            const res = await fetch('/register_remote', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name, image: frame })
            });
            const d = await res.json();
            alert(d.message);
        }
    </script>
</body>
</html>
