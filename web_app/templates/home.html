<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartWear Advisor</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<nav id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span>SmartWear</span>
    <button onclick="toggleTheme()">🌙</button>
  </div>

  <a href="/">🏠 Home</a>
  <a href="/admin/login">🔐 Admin</a>
</nav>

<button class="hamburger" onclick="toggleSidebar()">☰</button>

<div class="main-content">
  <h1>SmartWear Advisor</h1>

  <p id="status-text">Idle</p>
  <p id="location-msg">Getting location...</p>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <h2 id="name-display">---</h2>
  <p id="acc-display">---</p>

  <div class="controls">
    <button onclick="startApp()">Start</button>
    <button onclick="stopApp()">Stop</button>
    <button onclick="registerUser()">Register</button>
  </div>
</div>

<!-- ✅ MODULE FIX -->
<script type="module">
  import { startApp, stopApp, registerUser } from '/static/js/app.js';
  import { toggleTheme, toggleSidebar } from '/static/js/ui.js';

  window.startApp = startApp;
  window.stopApp = stopApp;
  window.registerUser = registerUser;
  window.toggleTheme = toggleTheme;
  window.toggleSidebar = toggleSidebar;
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/js/sw.js');
}
</script>

</body>
</html>
