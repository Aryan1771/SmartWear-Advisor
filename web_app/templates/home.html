<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartWear Advisor</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<!-- Sidebar -->
<nav id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span>SmartWear</span>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <a href="/">🏠 Home</a>
  <a href="/admin/login">🔐 Admin</a>
</nav>

<button class="hamburger" onclick="toggleSidebar()">☰</button>

<!-- Main -->
<div class="main-content">

  <h1>SmartWear Advisor</h1>

  <p id="status-text">Idle</p>
  <p id="location-msg">Getting location...</p>

  <!-- Camera -->
  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <!-- Info -->
  <h2 id="name-display">---</h2>
  <p id="acc-display">---</p>

  <!-- Controls -->
  <div class="controls">
    <button onclick="startApp()" class="btn">Start</button>
    <button onclick="stopApp()" class="btn">Stop</button>
    <button onclick="registerUser()" class="btn btn-success">Register</button>
  </div>

</div>

<script src="/static/js/ui.js"></script>
<script src="/static/js/app.js"></script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/js/sw.js');
}
</script>

</body>
</html>
