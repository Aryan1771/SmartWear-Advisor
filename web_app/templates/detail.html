<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result | SmartWear</title>

  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="main-content">

  <h1>Recognition Result</h1>

  <div class="card">
    <p><b>Name:</b> {{ name }}</p>
    <p><b>Mask:</b> {{ mask }}</p>
    <p><b>Glasses:</b> {{ glasses }}</p>
  </div>

  <div class="card">
    <p><b>City:</b> {{ weather.city }}</p>
    <p><b>Temperature:</b> {{ weather.temp }}°C</p>
    <p><b>Humidity:</b> {{ weather.humidity }}%</p>
    <p><b>UV:</b> {{ weather.uv }}</p>
    <p><b>AQI:</b> {{ weather.aqi_label }}</p>
  </div>

  <a href="/" class="btn">← Back</a>

</div>

<script src="/static/js/ui.js"></script>

</body>
</html>
